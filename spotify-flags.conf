# Spotify ignora ELECTRON_OZONE_PLATFORM_HINT (que Omarchy ya exporta), así que
# el hint hay que pasárselo como flag. Sin esto arranca bajo XWayland con
# --ozone-platform=x11 y se ve mal escalado.
# Este archivo lo lee /usr/bin/spotify, así que aplica lo mismo si lo abrís
# desde el menú, desde la terminal o por un enlace spotify:.
--ozone-platform=wayland
